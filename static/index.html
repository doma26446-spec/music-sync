<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Синхро-плеер</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <h1>🎵 Синхро-плеер</h1>
    <div id="room" class="room">комната: —</div>

    <div class="now">
      <div class="label">Сейчас играет</div>
      <div id="now" class="now-name">—</div>
      <div id="status" class="status">ожидание…</div>
    </div>

    <div class="controls">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" />
      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <div class="buttons">
        <button id="playbtn" class="btn-icon">▶</button>
      </div>
    </div>

    <div class="playlist">
      <div class="label">Плейлист (<span id="trackcount">0</span>)</div>
      <ul id="plist"></ul>
    </div>
    <button id="demo" class="demo-btn">▶ Демо-трек (локальный тест)</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
